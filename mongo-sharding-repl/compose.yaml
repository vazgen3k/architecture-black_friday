name: mongo-sharding

services:

  # сервер конфигурации
  configSrv:
    image: mongo:latest # docker образ
    container_name: configSrv
    restart: always
    ports:
      - "27017:27017"
    networks:
      - mongo-net
    volumes:
      - config-data:/data/db
    command:
      ["--configsvr", "--replSet", "config_server", "--bind_ip_all", "--port", "27017"]
    healthcheck:
      test: [ "CMD", "mongo", "--eval", "db.adminCommand('ping')" ]
      interval: 5s
      start_period: 10s

  shard1_1:
    image: mongo:latest
    container_name: shard1_1
    restart: always
    ports:
      - "27018:27018"
    networks:
      - mongo-net
    volumes:
      - shard1-1-data:/data/db
    command:
      ["--shardsvr", "--replSet", "shard1", "--bind_ip_all", "--port", "27018"]
    healthcheck:
      test: ["CMD", "mongosh", "--port", "27018", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      start_period: 10s

  shard1_2:
    image: mongo:latest
    container_name: shard1_2
    restart: always
    ports:
      - "27021:27021"
    networks:
      - mongo-net
    volumes:
      - shard1-2-data:/data/db
    command:
      [ "--shardsvr", "--replSet", "shard1", "--bind_ip_all", "--port", "27021" ]
    healthcheck:
      test: [ "CMD", "mongosh", "--port", "27021", "--eval", "db.adminCommand('ping')" ]
      interval: 5s
      start_period: 10s

  shard1_3:
    image: mongo:latest
    container_name: shard1_3
    restart: always
    ports:
      - "27022:27022"
    networks:
      - mongo-net
    volumes:
      - shard1-3-data:/data/db
    command:
      [ "--shardsvr", "--replSet", "shard1", "--bind_ip_all", "--port", "27022" ]
    healthcheck:
      test: [ "CMD", "mongosh", "--port", "27022", "--eval", "db.adminCommand('ping')" ]
      interval: 5s
      start_period: 10s

  shard2_1:
      image: mongo:latest
      container_name: shard2_1
      restart: always
      ports:
        - "27019:27019"
      networks:
        - mongo-net
      volumes:
        - shard2-1-data:/data/db
      command:
        ["--shardsvr", "--replSet", "shard2", "--bind_ip_all", "--port", "27019"]
      healthcheck:
        test: ["CMD", "mongosh", "--port", "27019", "--eval", "db.adminCommand('ping')"]
        interval: 5s
        start_period: 10s

  shard2_2:
    image: mongo:latest
    container_name: shard2_2
    restart: always
    ports:
      - "27023:27023"
    networks:
      - mongo-net
    volumes:
      - shard2-2-data:/data/db
    command:
      [ "--shardsvr", "--replSet", "shard2", "--bind_ip_all", "--port", "27023" ]
    healthcheck:
      test: [ "CMD", "mongosh", "--port", "27023", "--eval", "db.adminCommand('ping')" ]
      interval: 5s
      start_period: 10s

  shard2_3:
    image: mongo:latest
    container_name: shard2_3
    restart: always
    ports:
      - "27024:27024"
    networks:
      - mongo-net
    volumes:
      - shard2-3-data:/data/db
    command:
      ["--shardsvr", "--replSet", "shard2", "--bind_ip_all", "--port", "27024"]
    healthcheck:
      test: ["CMD", "mongosh", "--port", "27024", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      start_period: 10s


  # роутер
  mongos_router:
    image: mongo:latest
    container_name: mongos_router
    restart: always
    ports:
      - "27020:27020"
    networks:
      - mongo-net
    command:
      ["mongos", "--configdb", "config_server/configSrv:27017", "--bind_ip_all", "--port", "27020"]
    depends_on:
      - configSrv
      - shard1_1
      - shard1_2
      - shard1_3
      - shard2_1
      - shard2_2
      - shard2_3
    healthcheck:
      # test: ["CMD", "mongosh", "--port", "27020", "--eval", "db.adminCommand('ping')"]
      test: [ "CMD", "mongo", "--eval", "db.adminCommand('ping')" ]
      interval: 5s
      start_period: 10s

  pymongo_api:
    container_name: pymongo_api
    build: 
      context: api_app
      dockerfile: Dockerfile
    depends_on:
      - mongos_router
    ports:
      - 8080:8080
    environment:
      MONGODB_URL: "mongodb://mongos_router:27020"
      MONGODB_DATABASE_NAME: "somedb"
    networks:
      - mongo-net


volumes:
  config-data:
  shard1-1-data:
  shard1-2-data:
  shard1-3-data:
  shard2-1-data:
  shard2-2-data:
  shard2-3-data:

networks:
  mongo-net:
    driver: bridge